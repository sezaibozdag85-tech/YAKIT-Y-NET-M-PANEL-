<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Yakıt Yönetim Grubu</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#111;
  color:#fff;
  font-family:Arial,sans-serif;
}

.wrap{
  max-width:520px;
  margin:auto;
  padding:16px;
}

.card{
  background:#1d1d1d;
  border:1px solid #333;
  border-radius:18px;
  padding:20px;
  box-shadow:0 5px 20px #0008;
}

h1{
  text-align:center;
  font-size:25px;
  margin:5px 0 20px;
}

.sub{
  text-align:center;
  color:#aaa;
  margin-bottom:20px;
}

label{
  display:block;
  margin-bottom:8px;
  font-weight:bold;
}

input{
  width:100%;
  padding:15px;
  border-radius:12px;
  border:1px solid #555;
  background:#292929;
  color:white;
  font-size:17px;
  outline:none;
}

.days{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:15px;
}

.day{
  padding:15px 8px;
  border-radius:12px;
  border:1px solid #555;
  background:#292929;
  color:#fff;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

.day.selected{
  background:#d99a00;
  color:#111;
  border-color:#ffc400;
}

.day.taken{
  background:#3a2020;
  color:#999;
}

.save{
  width:100%;
  margin-top:18px;
  padding:16px;
  border:0;
  border-radius:12px;
  background:#d99a00;
  color:#111;
  font-size:18px;
  font-weight:bold;
}

.save:disabled{
  opacity:.5;
}

.msg{
  text-align:center;
  min-height:24px;
  margin-top:13px;
  font-weight:bold;
}

.schedule{
  margin-top:25px;
}

.schedule h2{
  font-size:20px;
  margin-bottom:10px;
}

.row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:12px;
  margin-bottom:7px;
  border-radius:10px;
  background:#292929;
}

.dayname{
  font-weight:bold;
}

.person{
  color:#ddd;
}

.empty{
  color:#777;
  font-style:italic;
}

.whatsapp{
  display:block;
  text-align:center;
  margin-top:18px;
  padding:14px;
  border-radius:12px;
  background:#168c45;
  color:#fff;
  text-decoration:none;
  font-weight:bold;
}
</style>
</head>

<body>

<div class="wrap">
<div class="card">

<h1>⛽ YAKIT YÖNETİM GRUBU</h1>

<div class="sub">
Her kurye uygun olduğu günü seçsin.
</div>

<label for="name">Adınız</label>

<input
  id="name"
  type="text"
  maxlength="60"
  placeholder="Adınızı ve soyadınızı yazın"
  autocomplete="name"
>

<div class="days" id="days"></div>

<button class="save" id="saveBtn" disabled>
Tercihimi Kaydet
</button>

<div class="msg" id="msg"></div>

<div class="schedule">
<h2>📅 Haftalık Yakıt Sırası</h2>
<div id="schedule">
  <div class="empty">Yükleniyor...</div>
</div>
</div>

<a
  class="whatsapp"
  href="https://chat.whatsapp.com/IqbVAw86I2OKvyOY0sV3Mk"
  target="_blank"
  rel="noopener"
>
💬 WhatsApp Grubuna Katıl
</a>

</div>
</div>

<script>

const SUPABASE_URL =
"https://wysvmjivmsezixvneauo.supabase.co";

const SUPABASE_KEY = "sb_publishable_2aNLAONKw3ctRmwGGzLS5g_YpJGH0x_";

const TABLE = "fuel_preferences";

const DAYS = [
"Pazartesi",
"Salı",
"Çarşamba",
"Perşembe",
"Cuma",
"Cumartesi",
"Pazar"
];

let records = [];
let selectedDay = "";

const nameInput = document.getElementById("name");
const daysBox = document.getElementById("days");
const saveBtn = document.getElementById("saveBtn");
const msg = document.getElementById("msg");
const scheduleBox = document.getElementById("schedule");

function apiHeaders(extra = {}) {
  return {
    "apikey": SUPABASE_KEY,
    "Content-Type": "application/json",
    ...extra
  };
}

function showMessage(text, success = false) {
  msg.textContent = text;
  msg.style.color = success ? "#55d98b" : "#ff7070";
}

function sameName(a,b) {
  return a.trim().toLocaleLowerCase("tr-TR") ===
         b.trim().toLocaleLowerCase("tr-TR");
}

function renderDays() {

  daysBox.innerHTML = "";

  DAYS.forEach(day => {

    const button = document.createElement("button");
    button.type = "button";
    button.className = "day";

    const name = nameInput.value.trim();

    const occupied = records.find(
      r => r.day === day &&
      (!name || !sameName(r.name,name))
    );

    if (occupied) {
      button.classList.add("taken");
      button.textContent = day + " • DOLU";
    } else {
      button.textContent = day;
    }

    if (selectedDay === day) {
      button.classList.remove("taken");
      button.classList.add("selected");
      button.textContent = day;
    }

    button.onclick = () => {

      const currentName = nameInput.value.trim();

      if (!currentName) {
        showMessage("Önce adınızı yazın.");
        nameInput.focus();
        return;
      }

      const takenBy = records.find(
        r => r.day === day &&
        !sameName(r.name,currentName)
      );

      if (takenBy) {
        showMessage(
          day + " günü " +
          takenBy.name +
          " tarafından seçilmiş."
        );
        return;
      }

      selectedDay = day;
      saveBtn.disabled = false;
      showMessage("");
      renderDays();
    };

    daysBox.appendChild(button);
  });
}

function renderSchedule() {

  scheduleBox.innerHTML = "";

  DAYS.forEach(day => {

    const row = document.createElement("div");
    row.className = "row";

    const dayName = document.createElement("div");
    dayName.className = "dayname";
    dayName.textContent = day;

    const person = document.createElement("div");
    person.className = "person";

    const record = records.find(r => r.day === day);

    if (record) {
      person.textContent = record.name;
    } else {
      person.textContent = "Boş";
      person.classList.add("empty");
    }

    row.appendChild(dayName);
    row.appendChild(person);
    scheduleBox.appendChild(row);
  });
}

async function loadRecords() {

  try {

    const response = await fetch(
      SUPABASE_URL +
      "/rest/v1/" +
      TABLE +
      "?select=id,name,day,created_at&order=id.asc",
      {
        method:"GET",
        headers:apiHeaders()
      }
    );

    if (!response.ok) {
      const detail = await response.text();
      throw new Error(
        "Sunucu hatası (" +
        response.status +
        "): " +
        detail
      );
    }

    records = await response.json();

    renderSchedule();
    renderDays();

    showMessage("");

  } catch(error) {

    console.error(error);

    scheduleBox.innerHTML =
      '<div class="empty">Veriler yüklenemedi.</div>';

    showMessage("Bağlantı hatası: " + error.message);
  }
}

async function savePreference() {

  const name = nameInput.value.trim();

  if (!name) {
    showMessage("Adınızı yazın.");
    nameInput.focus();
    return;
  }

  if (!selectedDay) {
    showMessage("Bir gün seçin.");
    return;
  }

  const occupied = records.find(
    r => r.day === selectedDay &&
    !sameName(r.name,name)
  );

  if (occupied) {
    showMessage(
      selectedDay +
      " günü " +
      occupied.name +
      " tarafından seçilmiş."
    );

    await loadRecords();
    return;
  }

  saveBtn.disabled = true;
  saveBtn.textContent = "Kaydediliyor...";
  showMessage("");

  try {

    const existing = records.find(
      r => sameName(r.name,name)
    );

    let response;

    if (existing) {

      response = await fetch(
        SUPABASE_URL +
        "/rest/v1/" +
        TABLE +
        "?id=eq." +
        encodeURIComponent(existing.id),
        {
          method:"PATCH",
          headers:apiHeaders({
            "Prefer":"return=representation"
          }),
          body:JSON.stringify({
            name:name,
            day:selectedDay
          })
        }
      );

    } else {

      response = await fetch(
        SUPABASE_URL +
        "/rest/v1/" +
        TABLE,
        {
          method:"POST",
          headers:apiHeaders({
            "Prefer":"return=representation"
          }),
          body:JSON.stringify({
            name:name,
            day:selectedDay
          })
        }
      );
    }

    if (!response.ok) {

      const detail = await response.text();

      if (response.status === 409) {
        throw new Error(
          "Bu gün başka biri tarafından seçilmiş olabilir."
        );
      }

      throw new Error(
        "Sunucu hatası (" +
        response.status +
        "): " +
        detail
      );
    }

    await loadRecords();

    showMessage(
      "✅ " +
      name +
      " — " +
      selectedDay +
      " kaydedildi.",
      true
    );

  } catch(error) {

    console.error(error);

    showMessage(
      "❌ " + error.message
    );

  } finally {

    saveBtn.textContent = "Tercihimi Kaydet";
    saveBtn.disabled = !selectedDay;
  }
}

nameInput.addEventListener("input", () => {

  const name = nameInput.value.trim();

  selectedDay = "";

  if (name) {

    const existing = records.find(
      r => sameName(r.name,name)
    );

    if (existing) {
      selectedDay = existing.day;
    }
  }

  saveBtn.disabled = !selectedDay;

  renderDays();
});

saveBtn.addEventListener(
  "click",
  savePreference
);

renderDays();
loadRecords();

</script>

</body>
</html>
